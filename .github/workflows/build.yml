name: 打包 Windows 安裝檔

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: 測試
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONFAULTHANDLER: "1"
        shell: pwsh
        run: |
          python -X faulthandler -m pytest -v --tb=short -rf -p no:cacheprovider tests *> pytest.txt
          $code = $LASTEXITCODE
          Get-Content pytest.txt
          "exit code: $code" | Add-Content pytest.txt
          exit $code

      - name: 回報測試輸出（失敗時貼到 commit 留言）
        if: failure() && steps.tests.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lines = Get-Content pytest.txt -Tail 150
          $body = "測試輸出（最後 150 行）`n``````n" + ($lines -join "`n") + "`n``````"
          @{ body = $body } | ConvertTo-Json | Set-Content -Encoding utf8 body.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input body.json

      - name: 打包程式
        run: pyinstaller --noconfirm shuoshuo.spec

      - name: 版本號
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=$(python -c 'import shuoshuo;print(shuoshuo.__version__)')" >> $GITHUB_ENV
          fi

      - name: 製作安裝檔
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss

      - name: 上傳安裝檔（到 Actions 頁面下載）
        uses: actions/upload-artifact@v5
        with:
          name: ShuoShuo-Setup
          path: installer/*.exe

      - name: 發布到 Releases（每次推送 main 都更新該版本的安裝檔）
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 說說 v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            下載下方的 ShuoShuo-Setup-${{ env.APP_VERSION }}.exe 安裝。
            第一次執行若出現「Windows 已保護您的電腦」，按「其他資訊」→「仍要執行」。
          files: installer/*.exe
          overwrite_files: true
