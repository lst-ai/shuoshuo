name: 打包 Windows 安裝檔

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: 測試
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short -rf tests > pytest.txt 2>&1
          code=$?
          cat pytest.txt
          if [ $code -ne 0 ]; then
            # 把失敗訊息寫成註記，方便在摘要頁直接看到
            grep -E "^(FAILED|ERROR|E  )|Error|error:" pytest.txt | head -30 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          fi
          exit $code

      - name: 打包程式
        run: pyinstaller --noconfirm shuoshuo.spec

      - name: 版本號
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=$(python -c 'import shuoshuo;print(shuoshuo.__version__)')" >> $GITHUB_ENV
          fi

      - name: 製作安裝檔
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss

      - name: 上傳安裝檔（到 Actions 頁面下載）
        uses: actions/upload-artifact@v5
        with:
          name: ShuoShuo-Setup
          path: installer/*.exe

      - name: 發布到 Releases（每次推送 main 都更新該版本的安裝檔）
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 說說 v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            下載下方的 ShuoShuo-Setup-${{ env.APP_VERSION }}.exe 安裝。
            第一次執行若出現「Windows 已保護您的電腦」，按「其他資訊」→「仍要執行」。
          files: installer/*.exe
          overwrite_files: true
